name: componentes_ui
description: Design system "Lista Clara" da MinhaSuite (tema, tokens e componentes Ss*).
publish_to: "none"
version: 1.8.1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  # Manrope + DM Mono, empacotadas aqui (assets/google_fonts): o app não precisa de cópia.
  google_fonts: ^6.2.1
  # AsyncValue do SsAsyncBody (todos os apps da suíte usam Riverpod 2).
  flutter_riverpod: ^2.5.1
  material_ui: ^1.11.1
  # `package:componentes_ui/testing.dart` (só nos testes dos apps): finders do material_ui.
  flutter_test:
    sdk: flutter

dev_dependencies:
  # Testes de idioma (SsStrings em en/es com os textos do Material).
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/google_fonts/
