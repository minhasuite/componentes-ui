name: componentes_ui
description: Design system "Lista Clara" da MinhaSuite (tema, tokens e componentes Ss*).
publish_to: "none"
version: 0.7.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # Manrope + DM Mono, empacotadas aqui (assets/google_fonts): o app não precisa de cópia.
  google_fonts: ^6.2.1
  # AsyncValue do SsAsyncBody (todos os apps da suíte usam Riverpod 2).
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/google_fonts/
