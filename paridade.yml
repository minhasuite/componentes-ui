# paridade.yml (v1.9; dívida zerada na v1.10.0; v1.11.0: SsAppleButton e SsPlatform; v1.12.0: o Kit Brasil; v1.13.0: confiança na IA e suíte; v1.14.0: interface e animação; v1.14.1: sem par novo, só parâmetros nos pares que já existem): o par web de cada peça do Flutter, e vice-versa.
#
# A regra da suíte é web e app com as mesmas funcionalidades; aqui fica escrito qual peça de um lado
# responde pela do outro. Dois testes leem este arquivo e falham quando alguém cria peça num lado só:
#   flutter/test/v19_paridade_web_test.dart  todo widget Ss* exportado pelo pacote está aqui, e todo
#                                            SsX daqui existe e é exportado;
#   rails/sample/test/components/v19_paridade_web_web_test.rb  todo Ss::*Component da gem está aqui,
#                                            e todo alvo Rails daqui existe.
#
# Seções:
#   pares:      SsX: "alvo" ou ["alvo", "alvo"]. Alvo: Ss::XComponent | helper:ss_x (ComponentesUi::Helpers)
#               | form:ss_x (o FormBuilder da gem) | css:.ss-x (classe do CSS da gem) | js:ss-x (controller Stimulus).
#               "...": peça que outro agente da onda v1.9 está criando; o teste
#               não cobra a existência enquanto tiver a marca (tirar no merge).
#   apis:       funções e classes do Flutter que não são widget (showSsSheet, SsIcons) com o par web.
#   so_app:     SsX: "motivo" (particularidade do app: gesto, câmera, infra do Flutter, carregar depois de abrir).
#   so_web:     Ss::XComponent: "motivo" (tela grande, teclado, landing, impressão).
#   divida:     peça do Flutter que ainda não tem par web e deveria ter (não é exceção: é para fazer).
#   divida_app: componente do Rails que ainda não tem par no Flutter.
# Peça nova: entre aqui na mesma mudança (o par, ou a exceção com o motivo).

