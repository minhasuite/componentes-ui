# demo.minhasuite.com (VPS, /opt/componentes-demo). O .env de lá tem só SECRET_KEY_BASE.
services:
  web:
    image: ghcr.io/minhasuite/componentes-demo:latest
    container_name: ms-componentes-demo
    restart: unless-stopped
    env_file: .env
    networks: [minhasuite-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  minhasuite-net:
    external: true
