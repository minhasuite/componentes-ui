name: Demo

# Publica a demonstração em demo.minhasuite.com (vitrine Rails + vitrine Flutter web + APK) a cada push
# na main, e anexa o APK à release de cada tag vX.Y.Z. Repo público: roda nos runners do GitHub
# (var RUNNER_LABEL=ubuntu-latest), não nos self-hosted da organização.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitrine:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0, cache: true }
      - name: Chave da demo
        env:
          KS: ${{ secrets.DEMO_KEYSTORE_B64 }}
          KP: ${{ secrets.DEMO_KEY_PROPERTIES }}
        run: |
          printf '%s' "$KS" | base64 -d > flutter/example/android/app/demo.jks
          printf '%s\n' "$KP" > flutter/example/android/key.properties
      - name: Vitrine Flutter (web e APK)
        working-directory: flutter/example
        run: |
          flutter pub get
          flutter build web --release --base-href /app/ --no-web-resources-cdn
          flutter build apk --release
          mkdir -p ../../demo/out
          cp -r build/web ../../demo/out/app
          cp build/app/outputs/flutter-apk/app-release.apk ../../demo/out/componentes-demo.apk
      - name: Imagem
        if: github.ref == 'refs/heads/main'
        run: |
          printf '%s\n' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/componentes-demo
          docker build -f Dockerfile.demo --build-arg GIT_SHA=${{ github.sha }} -t $IMG:latest -t $IMG:sha-${{ github.sha }} .
          docker push $IMG:latest && docker push $IMG:sha-${{ github.sha }}
      - name: APK na release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T=${GITHUB_REF_NAME}
          cp demo/out/componentes-demo.apk "componentes-demo-$T.apk"
          gh release view "$T" >/dev/null 2>&1 || gh release create "$T" --title "$T" --notes "Veja a seção $T no README. APK de demonstração anexado (instale fora da Play)."
          gh release upload "$T" "componentes-demo-$T.apk" --clobber

  deploy:
    needs: vitrine
    if: github.ref == 'refs/heads/main'
    uses: minhasuite/.github/.github/workflows/deploy.yml@master
    with:
      health_container: ms-componentes-demo
      compose_file: docker-compose.demo.yml
    secrets: inherit
